<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600..900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--n0:#fff;--n50:#F5F6F9;--n100:#EDEFF4;--n200:#E1E4EC;--n400:#9AA0B4;--n900:#14161E;
        --blue:#2E5EFF;--blue50:#EEF2FF;--violet:#7C5CFF;--coral:#FF6B4A;--mint50:#E7FAF1;}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:800px;background:var(--n50);font-family:Manrope,sans-serif;
       display:grid;place-items:center;overflow:hidden}
  .wrap{position:relative;width:1040px;height:660px;border-radius:26px;overflow:hidden;
        background:var(--n0);box-shadow:0 30px 70px rgba(20,22,30,.14)}
  svg{display:block;width:100%;height:100%}
  .pin{position:absolute;transform:translate(-50%,-100%);padding:5px 13px;border-radius:999px;
       background:var(--coral);color:#fff;font-weight:700;font-size:15px;white-space:nowrap;
       box-shadow:0 3px 12px rgba(20,22,30,.3)}
  .pin::after{content:"";position:absolute;bottom:-5px;left:50%;width:10px;height:10px;
              transform:translateX(-50%) rotate(45deg);background:inherit}
  .pin--rdv{background:var(--violet)}
  .pin--on{background:var(--n900);transform:translate(-50%,-100%) scale(1.06)}
  .card{position:absolute;left:44px;bottom:44px;width:352px;padding:20px 22px;border-radius:18px;
        background:var(--n0);box-shadow:0 14px 40px rgba(20,22,30,.18)}
  .live{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:#6F7689;margin-bottom:12px}
  .live::before{content:"";width:9px;height:9px;border-radius:50%;background:#10B981;box-shadow:0 0 0 4px var(--mint50)}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .shop{font-family:Gabarito,sans-serif;font-weight:800;font-size:22px;color:var(--n900)}
  .off{background:#FFF1ED;color:#D2431F;font-weight:700;font-size:14px;padding:3px 11px;border-radius:999px;white-space:nowrap}
  .meta{font-size:15px;color:#6F7689;margin:8px 0 12px}
  .price{font-family:Gabarito,sans-serif;font-weight:800;font-size:26px;color:var(--n900)}
  .was{font-size:16px;color:var(--n400);text-decoration:line-through;margin-left:10px}
</style></head><body>
<div class="wrap">
  <svg viewBox="0 0 1040 660" aria-hidden="true">
    <rect width="1040" height="660" fill="#fff"/>
    <g fill="var(--n50)" stroke="var(--n200)" stroke-width="1.4">
      <rect x="40" y="40" width="240" height="150" rx="10"/><rect x="320" y="40" width="200" height="150" rx="10"/>
      <rect x="560" y="40" width="250" height="115" rx="10"/><rect x="850" y="40" width="150" height="115" rx="10"/>
      <rect x="40" y="250" width="240" height="170" rx="10"/><rect x="320" y="250" width="200" height="120" rx="10"/>
      <rect x="720" y="215" width="280" height="160" rx="10"/>
      <rect x="40" y="480" width="200" height="140" rx="10"/><rect x="280" y="480" width="250" height="140" rx="10"/>
      <rect x="780" y="430" width="220" height="190" rx="10"/>
    </g>
    <path d="M560 0 C 610 150, 490 250, 560 380 C 615 490, 520 580, 575 660"
          fill="none" stroke="var(--blue50)" stroke-width="40" stroke-linecap="round"/>
    <path d="M320 400 h200 v52 h-52 v26 h-148 z" fill="var(--mint50)"/>
    <g stroke="var(--n200)" stroke-width="1.4">
      <line x1="0" y1="225" x2="1040" y2="225"/><line x1="0" y1="445" x2="1040" y2="445"/>
      <line x1="300" y1="0" x2="300" y2="660"/><line x1="745" y1="0" x2="745" y2="660"/>
    </g>
    <g font-family="Manrope,sans-serif" font-size="14" font-weight="600" letter-spacing="1.2" fill="var(--n400)">
      <text x="336" y="430">PARC</text><text x="862" y="250">GARE</text><text x="56" y="278">CENTRE</text>
    </g>
  </svg>
  <span class="pin pin--on" style="left:24%;top:40%">−60 %</span>
  <span class="pin pin--rdv" style="left:60%;top:27%">−40 %</span>
  <span class="pin" style="left:78%;top:62%">−45 %</span>
  <span class="pin pin--rdv" style="left:44%;top:74%">−35 %</span>
  <span class="pin" style="left:88%;top:35%">−50 %</span>
  <div class="card">
    <span class="live">En direct · 3e arrondissement</span>
    <div class="row"><span class="shop">Boulangerie Marchand</span><span class="off">−60 %</span></div>
    <p class="meta">350 m · valable encore 42 min · 3 places</p>
    <div><span class="price">4,00 €</span><span class="was">10,00 €</span></div>
  </div>
</div>
</body></html>
